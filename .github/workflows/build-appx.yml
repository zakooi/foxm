name: Build FoxM Windows 10 Mobile App (.appx)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Cấu hình Build (Release/Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

jobs:
  build-and-package:
    name: Build UWP (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [ARM, x86]

    steps:
    - name: 1. Checkout Mã nguồn
      uses: actions/checkout@v4

    - name: 2. Cài đặt MSBuild & Windows 10 SDK
      uses: microsoft/setup-msbuild@v2

    - name: 3. Khởi tạo Hình ảnh Assets Placeholder
      shell: pwsh
      run: |
        .\scripts\generate-assets.ps1

    - name: 4. Khôi phục Gói NuGet
      shell: pwsh
      run: |
        nuget restore FoxM.sln

    - name: 5. Biên dịch & Đóng gói Solution FoxM cho Windows 10 Mobile
      shell: pwsh
      run: |
        $config = "${{ github.event.inputs.build_configuration }}"
        if (-not $config) { $config = "Release" }
        $outDir = Join-Path $env:GITHUB_WORKSPACE "AppxPackages_${{ matrix.platform }}"
        
        msbuild FoxM.sln `
          /p:Configuration=$config `
          /p:Platform=${{ matrix.platform }} `
          /p:AppxBundle=Never `
          /p:GenerateAppxPackageOnBuild=true `
          /p:AppxPackageSigningEnabled=false `
          /p:AppxPackageDir="$outDir" `
          /m

    - name: 6. Tạo Chứng chỉ & Ký số Gói FoxM .appx
      shell: pwsh
      run: |
        $outDir = Join-Path $env:GITHUB_WORKSPACE "AppxPackages_${{ matrix.platform }}"
        $pfxPath = Join-Path $env:RUNNER_TEMP "FoxM_Cert.pfx"
        $cerPath = Join-Path $outDir "FoxM_Certificate.cer"
        $password = "FoxM2026Password!"
        
        # 1. Tạo chứng chỉ PFX & CER thời hạn 5 năm cho Publisher CN=FoxMDev
        .\scripts\generate-cert.ps1 -CertPath $pfxPath -Password $password
        
        # Xuất file CER để người dùng cài vào điện thoại Lumia
        $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $password)
        [System.IO.File]::WriteAllBytes($cerPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
        
        # 2. Tìm chỉ riêng file FoxM*.appx
        $appxFiles = Get-ChildItem -Path $outDir -Recurse -Filter "FoxM*.appx"
        if ($appxFiles.Count -eq 0) {
          $appxFiles = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "src/FoxM.UwpHost/bin") -Recurse -Filter "FoxM*.appx"
        }
        
        # 3. Ký số bằng SignTool x64 host
        $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1).FullName
        Write-Host "[FoxM Sign] Sử dụng SignTool: $signtool"
        
        foreach ($file in $appxFiles) {
          Write-Host "[FoxM Sign] Đang ký số file FoxM: $($file.FullName)"
          & $signtool sign /fd SHA256 /a /f $pfxPath /p $password $file.FullName
        }
        
        Write-Host "[FoxM Sign] Ký số gói FoxM hoàn tất thành công!" -ForegroundColor Green

    - name: 7. Tải Gói .appx Lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FoxM-Windows10Mobile-${{ matrix.platform }}
        path: |
          AppxPackages_${{ matrix.platform }}/**/*.appx
          AppxPackages_${{ matrix.platform }}/**/*.cer
          AppxPackages_${{ matrix.platform }}/**/*.ps1
          src/FoxM.UwpHost/bin/**/*.appx
        retention-days: 30
